[project]
name = "mini-claude-code"
version = "0.1.0"
description = "Mini coding agent with agentic search, a code dependency graph, and an MCP tool server"
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.1.0",
    "daytona>=0.225.0",
    "openai",
    "pydantic-settings",
    "swebench>=5.0.2",
    "textual>=8.2.8",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[project.scripts]
mclaude = "cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
include = [
    "agent*",
    "config*",
    "eval*",
    "graph*",
    "hooks*",
    "injection*",
    "mcp_server*",
    "router*",
    "sandbox*",
    "trace_store*",
    "ui*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# lets test files share a name in different folders without __init__.py files
addopts = "--import-mode=importlib"
